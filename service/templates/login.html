<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmokeWatch — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c0f;
  --surface: #111417;
  --surface2: #181c21;
  --border: #232830;
  --border-bright: #2e3640;
  --text: #c8d0db;
  --text-dim: #5a6470;
  --text-bright: #eef2f7;
  --accent: #e8424a;
  --accent-dim: rgba(232,66,74,0.12);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(35,40,48,0.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(35,40,48,0.4) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.bg-vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, var(--bg) 100%);
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 380px;
  padding: 24px;
}

.login-logo {
  text-align: center;
  margin-bottom: 40px;
}

.login-brand {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text-bright);
}

.login-brand span { color: var(--accent); }

.login-tagline {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px;
}

.login-heading {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-bright);
  margin-bottom: 4px;
}

.login-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.form-group { margin-bottom: 16px; }

label {
  display: block;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}

input[type="text"], input[type="password"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--text-bright);
  font-family: var(--sans);
  font-size: 13px;
  width: 100%;
  transition: border-color 0.15s;
  outline: none;
}

input:focus { border-color: var(--accent); }

.error-msg {
  background: rgba(232,66,74,0.1);
  border: 1px solid rgba(232,66,74,0.3);
  border-radius: 4px;
  padding: 9px 12px;
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 16px;
  display: none;
}

.error-msg.show { display: block; }

.btn-login {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 6px;
}

.btn-login:hover { background: #c93238; }

.credentials-hint {
  margin-top: 20px;
  padding: 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.8;
}

.credentials-hint strong { color: var(--text); }

.corner-decor {
  position: fixed;
  bottom: 24px;
  right: 24px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  opacity: 0.4;
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-brand"><span>Smoke</span>Watch</div>
    <div class="login-tagline">CCTV Monitoring / Smoking Detection</div>
  </div>

  <div class="login-card">
    <div class="login-heading">Авторизация</div>
    <div class="login-sub">Войдите в систему мониторинга</div>

    <div class="error-msg" id="error-msg">Неверный логин или пароль</div>

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Войти</button>
    </form>

    <div class="credentials-hint">
      <strong>admin</strong> / admin123 &mdash; полный доступ<br>
      <strong>operator</strong> / operator123 &mdash; просмотр
    </div>
  </div>
</div>

<div class="corner-decor">v2.0.0 &mdash; HSE Research Project</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    document.getElementById('error-msg').classList.add('show');
  }
})();
</script>
</body>
</html>
